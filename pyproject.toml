[tool.poetry]
name = "data-graphql-agent"
version = "0.1.0"
description = "MCP agent that generates Apollo GraphQL Server with BigQuery integration and Dataplex lineage tracking"
authors = ["OpenDedup"]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/opendedup/data-graphql-agent"
packages = [{include = "data_graphql_agent", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
python-dotenv = "^1.0.0"
pydantic = "^2.0.0"
google-cloud-bigquery = "^3.11.0"
google-cloud-storage = "^2.10.0"
jinja2 = "^3.1.0"
mcp = "^1.0.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.11.0"
pytest-cov = "^4.1.0"
freezegun = "^1.2.0"
responses = "^0.23.0"
black = "^23.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

